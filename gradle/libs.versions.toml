[versions]
androidGradlePlugin = "8.9.0"
androidxAppCompat = "1.7.0"
androidxTestExt = "1.2.1"
androidxEspresso = "3.6.1"
androidxLifecycle = "2.8.7"
androidxActivity = "1.9.3"
ktx = "1.15.0"
material = "1.7.8"
junit = "4.13.2"
kotlin = "2.1.0"
compose-bom = "2023.08.00"
material3 = "1.4.0-alpha07"
navigationCompose = "2.8.8"
kotlin-serialization = "2.0.21"
kotlinx-serialization-json = "1.7.3"


[libraries]
androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-compose-material = { group = "androidx.compose.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }
androidx-test-ext = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
